# Override opzionali per i nomi generati dagli helper
nameOverride: ""
fullnameOverride: ""

# Namespace di destinazione nel cluster Kubernetes
namespace: garage

# Immagine Docker per Rclone
image:
  repository: rclone/rclone
  tag: latest

# Configurazione sorgente (Minio)
minio:
  bucket: "cardinalis-prod"
  endpoint: "http://minio.minio-rgw.svc.cluster.local:80"
  secretName: "minio-source-credentials"

# Configurazione destinazione (Garage)
garage:
  bucket: "cardinalis-prod"
  endpoint: "http://garage.garage.svc.cluster.local:3900"
  region: "garage"
  secretName: "garage-dest-credentials"

# Parametri operativi Rclone
rclone:
  mode: "copy"                # Valori supportati: "copy", "check", "sync"
  dryRun: false               # Impostare a true per i test di simulazione
  ignoreErrors: true          # `--ignore-errors`: ignora file temporanei/WAL eliminati sul sorgente
  disableMultiThread: false    # `--multi-thread-streams=0`: disabilita il multi-thread sui singoli file
  multiThreadStreams: 4        # `--multi-thread-streams`: numero di thread per file (default: 4)
  multiThreadCutoff: "100M"   # `--multi-thread-cutoff`: dimensione minima del file per abilitare il multi-thread (default: 100M)
  verbose: true               # `-v`: mostra il dettaglio dei file elaborati nei log
  transfers: 64
  checkers: 128
  backoffLimit: 2

# Allocazione risorse per il Pod
resources:
  requests:
    cpu: "1000m"
    memory: "1Gi"
  limits:
    cpu: "4000m"
    memory: "4Gi"