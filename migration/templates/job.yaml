{{- $mode := .Values.rclone.mode -}}
{{- if not (has $mode (list "copy" "check" "sync")) -}}
{{- fail (printf "rclone.mode non valido: '%s' (ammessi: copy, check, sync)" $mode) -}}
{{- end -}}
{{- if not (has .Values.rclone.compare (list "checksum" "size-only")) -}}
{{- fail (printf "rclone.compare non valido: '%s' (ammessi: checksum, size-only)" .Values.rclone.compare) -}}
{{- end -}}
{{- if and .Values.rclone.maxAge (ne $mode "copy") -}}
{{- fail "rclone.maxAge e' ammesso solo con rclone.mode=copy (con sync/check darebbe risultati fuorvianti)" -}}
{{- end -}}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "rclone-migration.fullname" . }}-{{ $mode }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ include "rclone-migration.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    phase: {{ $mode }}
spec:
  backoffLimit: {{ int .Values.rclone.backoffLimit }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "rclone-migration.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        phase: {{ $mode }}
    spec:
      restartPolicy: Never
      containers:
        - name: rclone-runner
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          command: ["rclone"]
          args:
            - "--config="
            - "{{ $mode }}"
            {{- if .Values.rclone.dryRun }}
            - "--dry-run"
            {{- end }}
            {{- if eq $mode "sync" }}
            - "--delete-after"
            {{- if gt (int .Values.rclone.maxDelete) 0 }}
            - "--max-delete={{ int .Values.rclone.maxDelete }}"
            {{- end }}
            {{- end }}
            - "--transfers={{ int .Values.rclone.transfers }}"
            - "--checkers={{ int .Values.rclone.checkers }}"
            - "--timeout={{ .Values.rclone.timeout }}s"
            - "--contimeout={{ .Values.rclone.contimeout }}s"
            - "--low-level-retries={{ int .Values.rclone.lowLevelRetries }}"
            - "--fast-list"
            {{- if gt (int .Values.rclone.tpsLimit) 0 }}
            - "--tpslimit={{ int .Values.rclone.tpsLimit }}"
            - "--tpslimit-burst={{ int .Values.rclone.tpsBurst }}"
            {{- end }}
            {{- if .Values.rclone.disableMultiThread }}
            - "--multi-thread-streams=0"
            {{- end }}
            {{- if ne $mode "check" }}
            {{- /* Confronto veloce e meno richieste: solo per copy e sync. Il check usa i propri criteri. */}}
            {{- if eq .Values.rclone.compare "size-only" }}
            - "--size-only"
            {{- else }}
            - "--checksum"
            {{- end }}
            - "--s3-no-head"
            - "--s3-no-check-bucket"
            - "--s3-disable-checksum"
            {{- end }}
            {{- if eq $mode "copy" }}
            {{- if or .Values.rclone.noTraverse .Values.rclone.maxAge }}
            - "--no-traverse"
            {{- end }}
            {{- if .Values.rclone.maxAge }}
            - "--max-age={{ .Values.rclone.maxAge }}"
            {{- end }}
            {{- end }}
            {{- if eq $mode "check" }}
            {{- if .Values.rclone.checkDownload }}
            - "--download"
            {{- end }}
            - "--differ=-"
            - "--missing-on-dst=-"
            - "--missing-on-src=-"
            - "--error=-"
            {{- end }}
            {{- if .Values.rclone.verbose }}
            - "-v"
            {{- end }}
            {{- if .Values.rclone.stats }}
            - "--stats={{ .Values.rclone.stats }}"
            - "--stats-one-line"
            {{- end }}
            - "src:{{ .Values.source.bucket }}"
            - "dst:{{ .Values.destination.bucket }}"
          resources:
            requests:
              cpu: "{{ .Values.resources.requests.cpu }}"
              memory: "{{ .Values.resources.requests.memory }}"
            limits:
              cpu: "{{ .Values.resources.limits.cpu }}"
              memory: "{{ .Values.resources.limits.memory }}"
          env:
            {{- range $p, $cfg := dict "SRC" .Values.source "DST" .Values.destination }}
            - name: RCLONE_CONFIG_{{ $p }}_TYPE
              value: "s3"
            - name: RCLONE_CONFIG_{{ $p }}_PROVIDER
              value: {{ $cfg.provider | quote }}
            - name: RCLONE_CONFIG_{{ $p }}_ENV_AUTH
              value: "false"
            {{- if $cfg.region }}
            - name: RCLONE_CONFIG_{{ $p }}_REGION
              value: {{ $cfg.region | quote }}
            {{- end }}
            - name: RCLONE_CONFIG_{{ $p }}_ENDPOINT
              value: {{ $cfg.endpoint | quote }}
            - name: RCLONE_CONFIG_{{ $p }}_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: {{ $cfg.secretName }}
                  key: access_key_id
            - name: RCLONE_CONFIG_{{ $p }}_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $cfg.secretName }}
                  key: secret_access_key
            {{- end }}
